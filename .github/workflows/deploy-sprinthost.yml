name: Build and deploy SST to Sprinthost

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sprinthost-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production files
        run: npm run build

      - name: Deploy dist to Sprinthost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SPRINTHOST_FTP_SERVER }}
          username: ${{ secrets.SPRINTHOST_FTP_USERNAME }}
          password: ${{ secrets.SPRINTHOST_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.SPRINTHOST_SERVER_DIR }}
          log-level: standard
